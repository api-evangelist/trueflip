name: TrueFlip
description: >-
  TrueFlip was an international anonymous blockchain lottery with instant payouts,
  open-source draw code, and a transparent prize fund, launched in 2017 with an
  Ethereum token ICO and backed by Pantera Capital. The company's GitHub organization
  has been dormant since 2018, and the trueflip.io domain is suspended at the
  registrar (clientHold) with no DNS records; by early 2026 the domain was serving
  unrelated crypto-casino affiliate content. No public API, developer documentation,
  SDK packages, or machine-readable surface was found. Profile retained as a Pantera
  Capital portfolio record.
